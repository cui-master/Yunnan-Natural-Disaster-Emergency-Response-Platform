version: '3.8'

services:
  data-pipeline:
    build:
      context: ../data-pipeline
      dockerfile: Dockerfile
    container_name: yn-data-pipeline
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - CRAWLER_INTERVAL_MINUTES=30
    volumes:
      - ../data-pipeline/logs:/app/logs
    restart: unless-stopped
    networks:
      - yn-network

networks:
  yn-network:
    driver: bridge
