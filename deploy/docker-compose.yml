# ============================================================
# 云南省自然灾害应急响应平台 - Docker Compose 编排
#
# 服务拓扑:
#   frontend (Nginx:80) ──/api──▶ backend (SpringBoot:8083)
#                                        ├─▶ mysql:3306
#                                        ├─▶ neo4j:7687
#                                        ├─▶ redis:6379
#                                        ├─▶ ai-service:8050 ──▶ neo4j / Dify
#                                        └─▶ data-pipeline:8000
#
# 使用方法:
#   1. cp deploy/.env.docker.example .env   并按需修改密钥
#   2. docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#   3. 访问 http://localhost:${FRONTEND_PORT:-8088}
#
# 注: 本文件位于 deploy/ 目录，所有相对路径均以 deploy/ 为基准。
# ============================================================
name: disaster-emergency

services:
  # -------------------- MySQL 数据库 --------------------
  mysql:
    image: mysql:8.0
    container_name: disaster-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emergency_auth}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动建表 + 灌入种子数据（按文件名顺序执行）
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # -------------------- Neo4j 图数据库 --------------------
  neo4j:
    image: neo4j:5.23
    container_name: disaster-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-disaster2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt 协议
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-disaster2026} -a bolt://localhost:7687 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # -------------------- Redis 缓存（可选） --------------------
  redis:
    image: redis:7-alpine
    container_name: disaster-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # -------------------- 数据管道服务 (FastAPI:8000) --------------------
  data-pipeline:
    build:
      context: ../data-pipeline
      dockerfile: Dockerfile
    container_name: disaster-data-pipeline
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      DIFY_BASE_URL: ${DIFY_BASE_URL:-http://host.docker.internal:8080}
      DIFY_API_KEY_WORKFLOW: ${DIFY_API_KEY:-}
      DIFY_API_KEY_DATASET: ${DIFY_DATASET_API_KEY:-}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -------------------- AI 服务 (FastAPI:8050) --------------------
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: disaster-ai-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8050
      DEBUG: "false"
      # Neo4j（容器内通过服务名访问）
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-disaster2026}
      NEO4J_DATABASE: neo4j
      # Dify 工作流
      DIFY_BASE_URL: ${DIFY_BASE_URL:-http://host.docker.internal:8080}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_DATASET_BASE_URL: ${DIFY_BASE_URL:-http://host.docker.internal:8080}
      DIFY_DATASET_API_KEY: ${DIFY_DATASET_API_KEY:-}
      # LLM 降级
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: https://api.deepseek.com/v1
      DEEPSEEK_MODEL: deepseek-v4-flash
      TZ: Asia/Shanghai
    ports:
      - "8050:8050"
    depends_on:
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -------------------- Spring Boot 后端 (8083) --------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: disaster-backend
    restart: unless-stopped
    environment:
      # MySQL
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-emergency_auth}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-disaster2026}
      NEO4J_DATABASE: neo4j
      # 内部服务地址（容器间通信）
      AI_SERVICE_URL: http://ai-service:8050
      DATA_PIPELINE_URL: http://data-pipeline:8000
      # Dify
      DIFY_BASE_URL: ${DIFY_BASE_URL:-http://host.docker.internal:8080}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_DATASET_API_KEY: ${DIFY_DATASET_API_KEY:-}
      # 安全
      JWT_SECRET: ${JWT_SECRET:-YnNpEMR4VkZzT3pHWk5rQmFPeU1KV2dsc2J4dXRoaXZmd3l6MTIzNDU2Nzg5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8088}
      # JVM
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}
      TZ: Asia/Shanghai
    ports:
      - "8083:8083"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
      data-pipeline:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -------------------- 前端 (Nginx:80) --------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: disaster-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  uploads_data:
