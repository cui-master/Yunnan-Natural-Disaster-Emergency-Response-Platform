server:
  port: 8080

spring:
  application:
    name: emergency-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emergency}
    username: ${DB_USER:emergency}
    password: ${DB_PASSWORD:emergency123}
    driver-class-name: org.postgresql.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}
