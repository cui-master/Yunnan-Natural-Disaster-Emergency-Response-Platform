server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    name: emergency-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接地址通过环境变量注入，生产环境必须覆盖
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/emergency_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 密码通过环境变量注入，生产环境必须设置
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.yunnan.emergency.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 密钥通过环境变量注入，要求至少 32 字节（256 位）以满足 HMAC-SHA256 安全要求
  # 本地开发默认值仅用于 dev 环境，生产环境必须通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:YnNpEMR4VkZzT3pHWk5rQmFPeU1KV2dsc2J4dXRoaXZmd3l6MTIzNDU2Nzg5}
  expiration: 259200000  # 3天 (毫秒)，开发调试期间避免频繁登录
  header: Authorization
  prefix: Bearer

# AI 服务配置 (FastAPI - Dify 工作流代理，独立服务 8050 端口)
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8050}
  timeout: 180000

# 数据管道服务配置 (FastAPI - 天气爬虫、Dify 管理等)
data-pipeline:
  base-url: ${DATA_PIPELINE_URL:http://localhost:8000}
  timeout: 30000

# Dify 配置
dify:
  base-url: ${DIFY_BASE_URL:http://localhost:8080}
  # API 密钥通过环境变量注入，禁止明文存储
  api-key: ${DIFY_API_KEY:app-ELApZzN6iN2LXRfEU2ckM62R}
  workflow-id: natural-disaster-workflow
  dataset-api-key: ${DIFY_DATASET_API_KEY:dataset-sqapyDa5F43pjdaBdkwYn3VU}

# Neo4j 配置
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  # 密码通过环境变量注入，禁止明文存储
  password: ${NEO4J_PASSWORD:12345678}
  database: ${NEO4J_DATABASE:neo4j}

# 文件上传配置
file:
  upload-path: ./uploads
  url-prefix: /uploads

# CORS 跨域配置（生产环境必须限制为前端实际域名，禁止使用通配符）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# 日志配置
logging:
  level:
    com.yunnan.emergency: debug
    org.springframework.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# Knife4j / Swagger 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn
